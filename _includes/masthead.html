{% capture logo_path %}{{ site.logo }}{% endcapture %}

<div class="masthead">
  <div class="site-navbar">
    <div class="site-navbar__brand">
      {% unless logo_path == empty %}
        <a class="site-logo" href="{{ '/' | relative_url }}"><img src="{{ logo_path | relative_url }}" alt="{{ site.title }}"></a>
      {% endunless %}
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.masthead_title | default: site.title }}</a>
    </div>

    <nav class="site-nav-links" aria-label="主导航">
      <a class="site-nav-link{% if page.url == '/' %} site-nav-link--active{% endif %}" href="{{ '/' | relative_url }}">首页</a>
      <a class="site-nav-link{% if page.url contains '/categories' %} site-nav-link--active{% endif %}" href="{{ '/categories/' | relative_url }}">专题</a>
      <a class="site-nav-link{% if page.url contains '/about' %} site-nav-link--active{% endif %}" href="{{ '/about/' | relative_url }}">关于我</a>
    </nav>

    {% if site.search == true %}
      <div class="nav-search" role="search">
        <div class="nav-search__box">
          <i class="fas fa-search nav-search__icon" aria-hidden="true"></i>
          <input
            type="search"
            id="nav-search-input"
            class="nav-search__input"
            autocomplete="off"
            aria-label="{{ site.data.ui-text[site.locale].search_label_text | default: 'Enter your search term...' }}"
            placeholder="搜索"
          >
        </div>
        <div id="nav-search-results" class="nav-search__results" hidden></div>
      </div>
    {% endif %}

    <!-- keep empty greedy-nav shell so MM JS doesn't crash -->
    <nav id="site-nav" class="greedy-nav" style="display:none" aria-hidden="true">
      <ul class="visible-links"></ul>
      <button class="greedy-nav__toggle hidden" type="button"><div class="navicon"></div></button>
      <ul class="hidden-links hidden"></ul>
    </nav>
  </div>
</div>
